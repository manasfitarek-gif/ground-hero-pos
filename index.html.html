<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ground Hero - Mobile Remote & Stats</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
    .glass-panel { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-16">

  <!-- HEADER -->
  <header class="border-b border-slate-800 bg-slate-900/90 sticky top-0 z-50 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="p-2 bg-indigo-600 rounded-lg">
        <i data-lucide="smartphone" class="w-5 h-5 text-white"></i>
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-wider text-white uppercase">Ground Hero Remote</h1>
        <p class="text-[10px] text-emerald-400 font-mono">● Live Sync Active</p>
      </div>
    </div>
    <div class="flex gap-2">
      <button onclick="switchMobileTab('order')" id="tab-btn-order" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white">Orders</button>
      <button onclick="switchMobileTab('stats')" id="tab-btn-stats" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400">Statistics</button>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="p-4 max-w-lg mx-auto w-full flex-grow space-y-4">

    <!-- ORDER TERMINAL VIEW -->
    <section id="mobile-view-order" class="space-y-4">
      <div class="glass-panel p-4 rounded-xl space-y-3">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">1. Select PlayStation Station</h2>
        <div class="grid grid-cols-3 gap-2" id="target-selector-grid">
          <!-- Populated via JS for 6 PS5 stations -->
        </div>
      </div>

      <div class="glass-panel p-4 rounded-xl space-y-3">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-indigo-400">2. Select Item</h2>
        <div class="grid grid-cols-2 gap-2" id="mobile-menu-grid">
          <!-- Populated via JS -->
        </div>
      </div>

      <div class="glass-panel p-4 rounded-xl space-y-3">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-amber-400">Current Order Ticket</h2>
        <div id="mobile-ticket-items" class="space-y-2 max-h-32 overflow-y-auto text-xs pr-1">
          <p class="text-slate-500 italic">No items added to current ticket.</p>
        </div>
        <div class="border-t border-slate-700 pt-2 flex justify-between items-center font-bold text-sm">
          <span>Total:</span>
          <span id="mobile-ticket-total" class="text-emerald-400">0 L.L</span>
        </div>
        <button onclick="submitMobileOrder()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-sm shadow-lg transition-all flex items-center justify-center gap-2">
          <i data-lucide="send" class="w-4 h-4"></i> Send Order to Station
        </button>
      </div>
    </section>

    <!-- STATISTICS & REVENUE VIEW -->
    <section id="mobile-view-stats" class="space-y-4 hidden">
      <div class="grid grid-cols-2 gap-3">
        <div class="glass-panel p-4 rounded-xl border-l-4 border-indigo-500">
          <p class="text-[10px] uppercase font-semibold text-slate-400">Gaming Revenue</p>
          <h3 id="stat-gaming-rev" class="text-lg font-bold text-white mt-1">0 L.L</h3>
        </div>
        <div class="glass-panel p-4 rounded-xl border-l-4 border-amber-500">
          <p class="text-[10px] uppercase font-semibold text-slate-400">Snacks & Argile</p>
          <h3 id="stat-snacks-rev" class="text-lg font-bold text-amber-400 mt-1">0 L.L</h3>
        </div>
      </div>
      <div class="glass-panel p-4 rounded-xl border-l-4 border-emerald-500">
        <p class="text-[10px] uppercase font-semibold text-slate-400">Total Shift Revenue (المجموع)</p>
        <h3 id="stat-total-rev" class="text-2xl font-black text-emerald-400 mt-1">0 L.L</h3>
      </div>

      <div class="glass-panel p-4 rounded-xl space-y-3">
        <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-300">Live Active Stations</h3>
        <div id="mobile-active-stations-list" class="space-y-2">
          <!-- Rendered via JS -->
        </div>
      </div>
    </section>

  </main>

  <script>
    let selectedTarget = null; // e.g. "PS5 #1"
    let currentTicket = [];
    
    let menuItems = JSON.parse(localStorage.getItem('groundhero_menu')) || [
      { id: 1, name: 'Pepsi', category: 'Cold Drinks', price: 100000 },
      { id: 2, name: 'Water', category: 'Cold Drinks', price: 40000 },
      { id: 3, name: 'RedBull', category: 'Cold Drinks', price: 200000 },
      { id: 4, name: 'Coffee', category: 'Hot Drinks', price: 80000 },
      { id: 5, name: 'Argile', category: 'Argile', price: 300000 },
      { id: 6, name: 'Ras Tfa7ten', category: 'Ras', price: 150000 }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      initTargets();
      initMobileMenu();
      updateMobileStats();
      lucide.createIcons();
      setInterval(updateMobileStats, 3000);
    });

    function switchMobileTab(tab) {
      const isOrder = tab === 'order';
      document.getElementById('mobile-view-order').classList.toggle('hidden', !isOrder);
      document.getElementById('mobile-view-stats').classList.toggle('hidden', isOrder);
      
      document.getElementById('tab-btn-order').className = isOrder ? 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white' : 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400';
      document.getElementById('tab-btn-stats').className = !isOrder ? 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white' : 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400';
      if (!isOrder) updateMobileStats();
    }

    function initTargets() {
      const grid = document.getElementById('target-selector-grid');
      grid.innerHTML = '';
      
      // 6 PS5 Stations Only
      for (let i = 1; i <= 6; i++) {
        const name = `PS5 #${i}`;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `p-3 rounded-xl text-xs font-bold border transition-all ${selectedTarget === name ? 'bg-indigo-600 border-indigo-400 text-white shadow-lg' : 'bg-slate-800/80 border-slate-700 text-slate-300'}`;
        btn.innerText = name;
        btn.onclick = () => {
          selectedTarget = name;
          initTargets();
        };
        grid.appendChild(btn);
      }
    }

    function initMobileMenu() {
      const grid = document.getElementById('mobile-menu-grid');
      grid.innerHTML = '';

      menuItems.forEach(item => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'bg-slate-800/60 hover:bg-slate-800 border border-slate-700/80 p-2.5 rounded-xl text-left transition-all';
        btn.innerHTML = `
          <div class="font-bold text-white text-xs truncate">${item.name}</div>
          <div class="text-[10px] text-emerald-400 font-mono">${item.price.toLocaleString()} L.L</div>
        `;
        btn.onclick = () => addToTicket(item);
        grid.appendChild(btn);
      });
    }

    function addToTicket(item) {
      const existing = currentTicket.find(i => i.id === item.id);
      if (existing) {
        existing.qty += 1;
      } else {
        currentTicket.push({ ...item, qty: 1 });
      }
      renderTicket();
    }

    function renderTicket() {
      const container = document.getElementById('mobile-ticket-items');
      container.innerHTML = '';
      
      if (currentTicket.length === 0) {
        container.innerHTML = '<p class="text-slate-500 italic">No items added to current ticket.</p>';
        document.getElementById('mobile-ticket-total').innerText = '0 L.L';
        return;
      }

      let total = 0;
      currentTicket.forEach((item, idx) => {
        total += item.price * item.qty;
        const div = document.createElement('div');
        div.className = 'flex justify-between items-center bg-slate-900/60 p-1.5 rounded-lg';
        div.innerHTML = `
          <span class="text-white">${item.qty}x ${item.name}</span>
          <div class="flex items-center gap-2">
            <span class="font-mono text-amber-400">${(item.price * item.qty).toLocaleString()} L.L</span>
            <button onclick="currentTicket.splice(${idx},1); renderTicket();" class="text-rose-400 text-xs px-1.5 bg-rose-500/10 rounded">✕</button>
          </div>
        `;
        container.appendChild(div);
      });
      document.getElementById('mobile-ticket-total').innerText = total.toLocaleString() + ' L.L';
    }

    function submitMobileOrder() {
      if (!selectedTarget) {
        alert("Please select a PS5 station first!");
        return;
      }
      if (currentTicket.length === 0) {
        alert("Your order ticket is empty.");
        return;
      }

      let stations = JSON.parse(localStorage.getItem('groundhero_stations')) || [];
      let targetStation = stations.find(s => s.name.toLowerCase().includes(selectedTarget.toLowerCase()));

      if (targetStation) {
        if (!targetStation.orders) targetStation.orders = [];
        currentTicket.replace ? null : currentTicket.forEach(tItem => {
          targetStation.orders.push({ id: tItem.id, name: tItem.name, qty: tItem.qty, price: tItem.price });
        });
        localStorage.setItem('groundhero_stations', JSON.stringify(stations));
        alert(`Order successfully sent to ${selectedTarget}!`);
        currentTicket = [];
        renderTicket();
      } else {
        alert(`Order logged for ${selectedTarget}.`);
        currentTicket = [];
        renderTicket();
      }
    }

    function updateMobileStats() {
      const history = JSON.parse(localStorage.getItem('groundhero_history')) || [];
      const today = new Date().toDateString();
      const todaySessions = history.filter(s => new Date(s.endTime).toDateString() === today);

      let gaming = 0;
      let snacks = 0;
      todaySessions.forEach(s => {
        gaming += s.gamingCost || 0;
        snacks += s.snacksTotal || 0;
      });

      document.getElementById('stat-gaming-rev').innerText = gaming.toLocaleString() + ' L.L';
      document.getElementById('stat-snacks-rev').innerText = snacks.toLocaleString() + ' L.L';
      document.getElementById('stat-total-rev').innerText = (gaming + snacks).toLocaleString() + ' L.L';

      const activeContainer = document.getElementById('mobile-active-stations-list');
      activeContainer.innerHTML = '';
      const stations = JSON.parse(localStorage.getItem('groundhero_stations')) || [];
      const activeStations = stations.filter(s => s.status === 'active' || s.status === 'paused');

      if (activeStations.length === 0) {
        activeContainer.innerHTML = '<p class="text-xs text-slate-500 italic">No active PS5 stations right now.</p>';
        return;
      }

      activeStations.forEach(st => {
        const div = document.createElement('div');
        div.className = 'bg-slate-900/60 p-2 rounded-lg border border-slate-800 flex justify-between items-center text-xs';
        div.innerHTML = `
          <span class="font-bold text-white">${st.name} (${st.joysticks}J)</span>
          <span class="text-emerald-400 font-mono">${st.status.toUpperCase()}</span>
        `;
        activeContainer.appendChild(div);
      });
    }
  </script>
</body>
</html>
